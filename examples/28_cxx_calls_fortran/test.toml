# Test configuration for the cxx_calls_fortran example

[test]
description = "C++ primary calling Fortran via BIND(C), with automatic Fortran runtime injection"

expected_outputs = [
    # .o from MinGW g++, .obj from MSVC or clang-cl, whichever matches
    # the Fortran compiler's ABI on Windows.
    "build/obj.hello/src/main.cpp.o*",
    "build/obj.hello/src/math_utils.f90.o",
    "build/hello",
]

[verify]
commands = [
    { run = "./build/hello", expect_stdout = "3 + 4 = 7 (computed by Fortran)" },
]

[skip]
# Both must be found, with ABIs that link together: on Windows, MinGW
# gfortran goes with MinGW gcc, flang and ifx with MSVC or clang-cl.
requires_toolchains = ["c++", "fortran"]
# Xcode generator does not support Fortran
# Make generator doesn't support Ninja dyndep for Fortran module ordering
generators = ["xcode", "make"]
