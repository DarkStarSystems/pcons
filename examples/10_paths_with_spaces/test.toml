# Test configuration for the paths-with-spaces example

[test]
description = "Paths with spaces throughout: a source file, its directory, an include directory, and a define whose value contains spaces"

expected_outputs = [
    "build/my_program",
]

[verify]
commands = [
    { run = "./build/my_program", expect_stdout = "Hello from pcons!" },
]

[skip]
# POSIX ninja quotes these paths when it expands them, which is what the example
# checks. The Makefile generator doesn't escape spaces at all, so make reads one
# path as several targets (issue #70), and Xcode drives its own compile commands.
generators = ["make", "xcode"]
