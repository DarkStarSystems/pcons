# Test configuration for the metal-library example

[test]
description = "project.MetalLibrary compiles .metal shaders and links them into a loadable .metallib"

expected_outputs = [
    "build/obj.effects.metal/src/blur.metal.air",
    "build/obj.effects.metal/src/warp.metal.air",
    "build/effects.metallib",
]

[verify]
# metal-readobj only recognizes a real, well-formed metallib.
commands = [
    { run = "xcrun metal-readobj build/effects.metallib", expect_stdout = "Format: MetalLib" },
]

[skip]
# Metal is an Apple toolchain. Since Xcode 26 the metal compiler is a
# separate download (xcodebuild -downloadComponent MetalToolchain); until
# then `xcrun metal` is a stub that refuses to run.
platforms = ["linux", "windows"]
require_succeeds = ["xcrun metal --version"]
# The xcode generator has no notion of a metallib target, so it emits an
# empty project. ninja and make both build this correctly.
generators = ["xcode"]
