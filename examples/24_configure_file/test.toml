# Test configuration for the configure checks + configure_file example

[test]
description = "Demonstrates compiler feature checks feeding configure_file()"

expected_outputs = [
    "build/config.h",
    "build/obj.configure_demo/src/main.c.o",
    "build/configure_demo",
]

[verify]
commands = [
    { run = "./build/configure_demo", expect_stdout = "Version: 1.2.3" },
    { run = "./build/configure_demo", expect_stdout = "HAVE_STDINT_H: 1" },
    { run = "./build/configure_demo", expect_stdout = "frobnicate: no" },
    { run = "./build/configure_demo", expect_stdout = "sizeof(void*): 8" },
]

[skip]
# configure_file writes to build dir; make/xcode have different cwd assumptions
generators = ["make", "xcode"]
