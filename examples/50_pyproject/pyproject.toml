[build-system]
requires = ["pcons", "conan"]
build-backend = "pcons.pyproject"

[project]
name = "pcons_hello_ext"
dynamic = ["version"]
description = "Example nanobind extension built with the pcons backend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.scripts]
pcons-hello-ext = "pcons_hello_ext:hello_world"

# Editable installs build with the project's own Python, so build/ can
# regenerate itself later: uv installs the dev group first, then builds
# this package without build isolation.
[dependency-groups]
dev = ["pcons", "ninja", "conan"]

[tool.uv]
no-build-isolation-package = ["pcons_hello_ext"]
# The version comes from VERSION through the provider, so a change there must
# trigger a rebuild.
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.pcons]
variant = "release"
version-provider = "version_provider:get_version"
# The install target to use for building the wheel.
# If not specified, the default "wheel" target will be used.
install-target = "install"

# Optional variables to pass to pcons for building.
# variables = { BUILD_TESTS = "OFF" } # example
