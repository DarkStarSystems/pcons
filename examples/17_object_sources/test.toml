# Test configuration for the object_sources example

[test]
description = "Per-file flags: add_sources(env=...) inside a target, and standalone env.cc.Object()"

# Files that should exist after the build.
# helper.o is compiled separately via env.cc.Object(); main.c and tuned.c are
# compiled by the target, tuned.c with its own environment.
expected_outputs = [
    "build/helper.o",
    "build/obj.demo/src/main.c.o",
    "build/obj.demo/src/tuned.c.o",
    "build/demo",
]

[verify]
commands = [
    { run = "./build/demo", expect_stdout = "Value from helper: 42" },
    # tuned.c saw -DTUNED; its neighbours did not.
    { run = "./build/demo", expect_stdout = "tuned.c was compiled with its own flags" },
]

[skip]
# Works on all platforms with a C compiler
# Xcode generator doesn't support pre-compiled object files in sources yet
generators = ["xcode"]
