# Test configuration for the Rust + C++ hybrid example.

[test]
description = "Build a Rust staticlib via cargo and link it into a C++ program"
# Cargo's cold-registry fetch plus the native-static-libs probe can push
# configure and build past the default limits on slow CI runners (Windows
# especially), where this example is a marginal timeout otherwise.
timeout = 240
build_timeout = 300

expected_outputs = [
    "build/hello_rust",
]

[verify]
commands = [
    { run = "./build/hello_rust", expect_stdout = "Hello from Rust, pcons!" },
    { run = "./build/hello_rust", expect_stdout = "2 + 3 = 5" },
]

[[rebuild]]
description = "Nothing changed: no work"
expect_no_work = true

[[rebuild]]
description = "A module added after pcons ran is compiled in"
write = { "rust/src/arith.rs" = """
mod offset;

pub fn add(a: i32, b: i32) -> i32 {
    a + b + offset::OFFSET
}
""" }
create = { "rust/src/arith/offset.rs" = "pub const OFFSET: i32 = 0;\n" }
run = "./build/hello_rust"
expect_stdout = "2 + 3 = 5"

[[rebuild]]
description = "Editing only that module reruns cargo, found through its dep-info"
write = { "rust/src/arith/offset.rs" = "pub const OFFSET: i32 = 10;\n" }
run = "./build/hello_rust"
expect_stdout = "2 + 3 = 15"

[[rebuild]]
description = "Removing it again rebuilds rather than failing on the missing file"
write = { "rust/src/arith.rs" = """
pub fn add(a: i32, b: i32) -> i32 {
    a + b
}
""" }
remove = ["rust/src/arith/offset.rs"]
run = "./build/hello_rust"
expect_stdout = "2 + 3 = 5"

[skip]
# Need a Rust toolchain. Skip everywhere it's missing.
requires = ["cargo"]
# Xcode and Makefile generators are not tested here — the focus is
# verifying that pcons → ninja → cargo → ninja relink works.
generators = ["xcode", "make"]
