# Test configuration for the overlay-dirs example

[test]
description = "Two source trees merged into one staging directory with OverlayDir: the later source wins a shared path, nested paths survive, one directory takes a child from each tree, and exclude= drops what should not ship"

expected_outputs = [
    "build/stage/config.txt",
    "build/stage/res/xml/a.txt",
    "build/stage/res/drawable/b.txt",
    "build/stage/src/com/example/Thing.java",
]

[verify]
# There is no program to run here: the assertion is what ended up *inside* the
# staged files. Checking that a path exists would pass just as well for a
# builder that copied the wrong tree's version of it.
commands = [
    # The conflict. Both trees hold config.txt; app is second, so app wins.
    { run = "cat build/stage/config.txt", expect_stdout = "origin = app tree" },
    # A nested path, not flattened to stage/Thing.java.
    { run = "cat build/stage/src/com/example/Thing.java", expect_stdout = "shared tree wrote Thing.java" },
    # One directory, a child from each tree.
    { run = "cat build/stage/res/xml/a.txt", expect_stdout = "shared tree wrote res/xml/a.txt" },
    { run = "cat build/stage/res/drawable/b.txt", expect_stdout = "app tree wrote res/drawable/b.txt" },
    # excluded in both trees, so there is nothing to read.
    { run = "cat build/stage/notes.md", expect_returncode = 1 },
]

[[rebuild]]
description = "Nothing changed"
expect_no_work = true

[[rebuild]]
description = "Editing a source file restages it, and pcons is not re-run"
write."shared/res/xml/a.txt" = "edited in place\n"
expect_rebuild = ["*stage.stamp"]
expect_no_rebuild = ["build.ninja"]
run = "cat build/stage/res/xml/a.txt"
expect_stdout = "edited in place"

[skip]
# Runs on Linux, macOS and Windows -- nothing here is platform-specific.
# The Xcode generator cannot express an overlay -- which tree wins a path is
# settled while the command runs -- and refuses this project outright rather
# than emitting an aggregate target that stages nothing.
generators = ["xcode"]
