# Test configuration for the python-action pipeline example

[test]
description = "Two PyActions, each called twice, feeding a C compile and link: one fetches a document, one embeds it as a byte array"

# Two network fetches plus three compiles and links. The budget is for the
# fetches, which are the only part that depends on somebody else's machine.
timeout = 300

# Only existence. The fetched documents differ on every run, so nothing here
# can assert their contents; check_pipeline.py compares the built programs
# against the files that fed them instead.
expected_outputs = [
    "build/lorem.txt",
    "build/motto.txt",
    "build/lorem.c",
    "build/motto.c",
    "build/awkward.c",
    "build/pyact/fetch.py",
    "build/pyact/embed.py",
    "build/lorem",
    "build/motto",
    "build/awkward",
]

[verify]
commands = [
    { run = "uv run python check_pipeline.py", expect_stdout = "pipeline ok" },
]

[[rebuild]]
description = "Nothing changed: in particular the fetches do not run again"
expect_no_work = true

[[rebuild]]
description = "The local document changed: its embed and link re-run, the fetched chains do not"
touch = "src/awkward.bin"
expect_rebuild = ["awkward.c", "awkward"]
expect_no_rebuild = ["lorem.txt", "motto.txt", "lorem.c", "motto.c"]

[[rebuild]]
description = "The build script changed but no action did: regenerating alone re-runs nothing"
touch = "pcons-build.py"
expect_rebuild = ["build.ninja"]
expect_no_rebuild = ["lorem.txt", "motto.txt", "lorem.c", "motto.c", "awkward.c"]

[[rebuild]]
description = "An embed edit re-runs both embeds and no fetch; a URL edit re-runs one chain"
run = "uv run python rebuild_check.py"
expect_stdout = "rebuild ok"
