# Test configuration for the cxx_modules example

[test]
description = "Demonstrates C++20 named modules with Ninja dyndep ordering"
# Configure a second time and require ninja to find nothing to do: the module
# scans the second run reuses from its cache must answer what the first run's
# scans did.
configure_twice = true

expected_outputs = [
    "build/obj.hello/src/mod1.cppm.o",
    "build/obj.hello/src/mod2.cppm.o",
    "build/obj.hello/src/main.cpp.o",
    "build/hello",
]

[toolchains]
linux = ["gcc", "llvm"]
darwin = ["llvm"]
windows = ["msvc", "gcc"]

[verify]
commands = [{ run = "./build/hello", expect_returncode = 0 }]


[[rebuild]]
description = "Touching mod1.cppm triggers rebuild of mod1, main, and the final executable"
touch = "src/mod1.cppm"
expect_rebuild = [
    "obj.hello/src/mod1.cppm.o",
    "obj.hello/src/main.cpp.o",
    "hello",
]

[[rebuild]]
description = "Touching mod2.cppm triggers rebuild of mod2, main, and the final executable"
touch = "src/mod2.cppm"
expect_rebuild = [
    "obj.hello/src/mod2.cppm.o",
    "obj.hello/src/main.cpp.o",
    "hello",
]

[[rebuild]]
description = "Touching MyHeader.hpp triggers rebuild of mod1, mod2, main, and the final executable"
touch = "src/MyHeader.hpp"
expect_rebuild = [
    "obj.hello/src/mod1.cppm.o",
    "obj.hello/src/mod2.cppm.o",
    "obj.hello/src/main.cpp.o",
    "hello",
]

[[rebuild]]
description = "No rebuild when nothing changed"
expect_no_work = true

# The dyndep file is written at configure time out of what every TU imports, so
# a source whose import list changes has to re-run pcons before the next build.
# Without that, main.cpp.o carries an empty dyndep entry, ninja is free to
# compile it before the module it imports, and it reads the BMI the previous
# build left on disk.
[[rebuild]]
description = "main.cpp dropping its imports regenerates the build files"
write."src/main.cpp" = """
// SPDX-License-Identifier: MIT
int main() { return 0; }
"""
expect_rebuild = ["build.ninja", "obj.hello/src/main.cpp.o", "hello"]
run = "./build/hello"

[[rebuild]]
description = "main.cpp gaining an import is compiled against the new module BMI"
write."src/MyHeader.hpp" = """
#pragma once

inline int get_answer() {
    return 7;
}
"""
write."src/main.cpp" = """
// SPDX-License-Identifier: MIT
import Mod1;

int main() { return mod1::answer() == 7 ? 0 : 1; }
"""
expect_rebuild = [
    "build.ninja",
    "obj.hello/src/mod1.cppm.o",
    "obj.hello/src/main.cpp.o",
    "hello",
]
run = "./build/hello"
expect_returncode = 0

[skip]
# Named modules: MSVC scans natively (cl.exe), GCC via g++, clang via
# clang-scan-deps. Gate per toolchain so an MSVC-only Windows host still runs.
requires_cxx_modules = true
generators = ["xcode", "make"]
