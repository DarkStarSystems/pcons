# Test configuration for the nested QML layout example

[test]
description = "Nested QML layout: an entry keeps its path, and each subdirectory gets a qmldir"

expected_outputs = [
    "build/qt.nested_ui/qrc_nested_ui.cpp",
    "build/chips/qt.chips_ui/qrc_chips_ui.cpp",
    # (the per-directory qmldir files are generated too, but the test
    # harness's Windows .exe heuristic can't express an extension-less
    # expected file; the [verify] commands below need them all to exist.)
    "build/qml_nested",
]

[verify]
commands = [
    { run = "./build/qml_nested", expect_stdout = "type Detail is qml/pages/Detail.qml" },
    { run = "./build/qml_nested", expect_stdout = "type Badge is qml/widgets/Badge.qml" },
    { run = "./build/qml_nested", expect_stdout = "url qrc:/qt/qml/PconsNested/qml/pages/Detail.qml is qml/pages/Detail.qml" },
    { run = "./build/qml_nested", expect_stdout = "neighbor of qrc:/qt/qml/PconsNested/qml/pages/Detail.qml is qml/widgets/Badge.qml" },
    { run = "./build/qml_nested", expect_stdout = "url qrc:/qt/qml/PconsNested/Chips/qml/Chip.qml is qml/Chip.qml" },
    { run = "./build/qml_nested", expect_stdout = "type Chip is qml/Chip.qml" },
]

[skip]
require_qt = true
require_qt_modules = ["Qml"]
generators = ["make", "xcode"]
