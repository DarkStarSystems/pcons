# Test configuration for the Windows manifest example

[test]
description = "Windows SxS: an embedded app manifest and a private assembly that actually loads"

expected_outputs = [
    "build/obj.myapp/src/main.c.obj",
    "build/myapp.exe",
    "build/app.manifest",
    # The DLL and its manifest live in the assembly directory, not beside the
    # executable -- that is what forces SxS to do the resolving.
    "build/ManifestExample.MyLib/MyLib.dll",
    "build/ManifestExample.MyLib/ManifestExample.MyLib.manifest",
]

[verify]
# Running the program is the whole point. MyLib.dll is not on any search path
# the loader would try, so if either manifest is wrong -- a mismatched
# processorArchitecture, a missing dependency, a manifest the linker did not
# embed -- the process fails to start and this fails loudly.
commands = [
    { run = "./build/myapp.exe", expect_stdout = "Hello from MyLib!" },
    { run = "./build/myapp.exe", expect_stdout = "2 + 3 = 5" },
]

[skip]
# Only run on Windows - requires MSVC or clang-cl toolchain
platforms = ["linux", "darwin"]
# Requires either MSVC (cl.exe) or clang-cl to be installed
requires_any = ["cl.exe", "clang-cl.exe"]
# Windows manifests don't work with Xcode or Make on Windows
generators = ["xcode", "make"]
