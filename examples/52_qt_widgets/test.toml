# Test configuration for the Qt Widgets (QtProgram/automoc) example

[test]
description = "Qt Widgets app via QtProgram: automoc, .ui and .qrc in sources"

# Often the first example its CI job runs on Windows, so it pays the cold
# MSVC-discovery cost that has blown the default 60s on slow runners, the
# same budget 01_hello_c carries.
timeout = 180

expected_outputs = [
    "build/qt.qt_widgets/src/moc_mainwindow.cpp",
    "build/qt.qt_widgets/mocs_compilation.cpp",
    "build/qt.qt_widgets/src/ui_mainwindow.h",
    "build/qt.qt_widgets/qrc_resources.cpp",
    "build/qt_widgets",
]

[verify]
commands = [
    { run = "./build/qt_widgets", expect_stdout = "Hello from Qt Designer" },
    { run = "./build/qt_widgets", expect_stdout = "Hello from Qt resources" },
    { run = "./build/qt_widgets", expect_stdout = "signals ok" },
]

[skip]
require_qt = true
# Depfile-driven codegen is ninja territory.
generators = ["make", "xcode"]
