# Test configuration for the command-launcher example

[test]
description = "Commands run behind a launcher: two stacked wrappers (a compiler-cache stand-in and a timer) in front of every C compile, with compile_commands.json still reporting the real compiler"

expected_outputs = [
    "build/obj.hello/src/hello.c.o",
    "build/hello",
    # Written only by the launchers, so its existence proves they ran.
    "build/launchers.log",
]

[verify]
commands = [
    { run = "./build/hello", expect_stdout = "Built behind two launchers" },
    # Both launchers ran, in the right order, and the compile still happened.
    { run = "uv run python check_launchers.py", expect_stdout = "launchers ok" },
]

[skip]
# Xcode drives its own compile commands, so a launcher on cc has nowhere to go.
generators = ["xcode"]
