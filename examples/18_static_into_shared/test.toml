# Test configuration for static library linked into shared library
# Tests the pattern: static lib -> shared lib -> executable

[test]
description = "Tests linking a static library into a shared library"

# Files that should exist after the build
expected_outputs = [
    "build/bin/demo${BINARY_EXT}",
    "build/bin/${LIBRARY_PREFIX}wrapper${LIBRARY_EXT}",
]

# Files that should exist after install
expected_install_outputs = [
    "${BINARY_INSTALL_DIR}/demo${BINARY_EXT}",
    "${ARCHIVE_INSTALL_DIR}/${LIBRARY_PREFIX}core${ARCHIVE_EXT}",
    "${LIBRARY_INSTALL_DIR}/${LIBRARY_PREFIX}wrapper${LIBRARY_EXT}",
]

[verify]
# Run the built program and check output
# core_value() returns 42, wrapper multiplies by 2 = 84
# Need to set library path since the shared lib is in ./build/bin/
commands = [
    { run = "DYLD_LIBRARY_PATH=./build/bin LD_LIBRARY_PATH=./build/bin ./build/bin/demo", expect_stdout = "Value from wrapper: 84" },
]

# Windows version - the .dll is found beside the program
commands_windows = [
    { run = "build\\bin\\demo.exe", expect_stdout = "Value from wrapper: 84" },
]

[skip]
# Xcode builds to different output paths
generators = ["xcode"]
