# SPDX-License-Identifier: MIT
name: Fuzz

permissions:
  contents: read

on:
  schedule:
    - cron: "17 7 * * *"  # nightly, 07:17 UTC
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
      # Hypothesis records failing examples here and replays them first on
      # the next run, so a nightly failure stays reproducible after the
      # random seed has moved on.
      - name: Restore Hypothesis example database
        uses: actions/cache@v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}
          restore-keys: hypothesis-
      - name: Install dependencies
        run: uv sync
      # The path-escaping properties check their build files by running
      # ninja on them; without it that half of the campaign just skips.
      - name: Install ninja
        run: uv tool install ninja
      - name: Run property tests
        run: uv run pytest tests/fuzz -m fuzz --hypothesis-profile=nightly
