[project]
name = "pcons"
dynamic = ["version"]
description = "A cross-platform software build system, configured in Python, that generates Ninja files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gary Oberbrunner", email = "garyo@oberbrunner.com" }]
requires-python = ">=3.11"
keywords = ["build", "build-system", "ninja", "scons", "cmake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "click>=8.1",  # CLI parsing
    "tomli>=2.0;python_version<'3.11'",  # TOML parsing (built-in in 3.11+)
    "tomli-w>=1.0",  # TOML writing
    "pbxproj>=3.0.0",  # Xcode project file manipulation
    # Native filesystem notification for `pcons --watch`. Marked to the
    # platforms pcons supports, which are the ones watchfiles ships wheels
    # for: elsewhere pcons still installs, and only --watch is unavailable.
    "watchfiles>=1.0; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
# Nothing extra on the platforms above, where watchfiles is already a
# dependency. Elsewhere this asks for it anyway, building from source.
watch = [
    "watchfiles>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
    "mypy>=1.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
pcons = "pcons.cli:main"
pcons-fetch = "pcons.packages.fetch.cli:main"

[project.entry-points."rez.plugins.build_system"]
# Registers PconsBuildSystem with rez. After `pip install pcons` (or
# `uv tool install rez --with-editable <pcons-checkout>`), `rez-build`
# auto-detects packages with a pcons-build.py and builds them with pcons.
pcons = "pcons.integrations.rez.build_system"

[project.urls]
Homepage = "https://github.com/DarkStarSystems/pcons"
Repository = "https://github.com/DarkStarSystems/pcons"
Documentation = "https://pcons.readthedocs.io/"
Issues = "https://github.com/DarkStarSystems/pcons/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pcons/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pcons"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.8",
    "hypothesis>=6.100",
    "mypy>=1.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# --dist loadgroup keeps @pytest.mark.xdist_group tests on one worker, so the
# conan-based examples share a Conan cache instead of racing to populate it.
addopts = "-v --tb=short --dist loadgroup"
markers = [
    "fuzz: property-based test (tests/fuzz); runs a short campaign by default and a long one nightly",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ty.src]
# The rez integration imports `rez`, which is intentionally not a pcons
# dependency, so it can't be type-checked in the default (rez-free)
# environment; the `test-rez` CI job type-checks it with rez installed.
# rez_packages/ holds example package.py files, not pcons source.
exclude = ["**/integrations/rez/**", "**/rez_packages/**"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pcons"]

[tool.coverage.run]
source = ["pcons"]
branch = true
omit = [
    # Generated TYPE_CHECKING-only stub mixins. Their class bodies live
    # under `if TYPE_CHECKING:`, so nothing executes at runtime; reporting
    # them as 0%-covered is misleading. The generator that produces them
    # (pcons/_gen_stubs.py) is tested directly.
    "pcons/core/_project_builder_stubs.py",
    "pcons/core/_environment_stubs.py",
    "pcons/core/_toolconfig_stubs.py",
    "pcons/core/_usage_requirements_stubs.py",
    "pcons/core/_toolchain_names.py",
    # A worker and the client that reaches it only ever run as separate
    # processes -- ninja starts the client, the client starts the worker --
    # so coverage in the test process cannot see them however thoroughly they
    # are exercised. tests/test_workers.py drives both end to end, over a real
    # socket; measuring them here would report a number about how they are
    # started rather than about how well they are tested.
    "pcons/workers/client.py",
    "pcons/workers/python_server.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
